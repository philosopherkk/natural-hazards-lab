<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Volcano Lab — interactive 3D eruption timeline with educational stages" />
    <title>Volcano Lab</title>
  </head>
  <body>
    <div id="app" class="layout">
      <header class="top-bar">
        <div class="brand">
          <h1 data-i18n="title">Volcano Lab</h1>
          <p class="subtitle" data-i18n="subtitle">Interactive Eruption Timeline</p>
        </div>
        <button type="button" id="lang-toggle" class="btn btn-ghost" aria-label="Switch language">
          中文
        </button>
      </header>

      <main class="main-grid">
        <section class="viewport-panel" aria-labelledby="viewport-heading">
          <h2 id="viewport-heading" class="visually-hidden">3D viewport</h2>
          <div id="canvas-wrap" class="canvas-wrap" role="img" aria-label="Volcano model">
            <p id="loading" class="loading" role="status">Initializing…</p>
          </div>
          <div class="transport" role="group" aria-label="Timeline transport">
            <button type="button" id="play-btn" class="btn btn-primary">Play</button>
            <button type="button" id="reverse-btn" class="btn" aria-pressed="false">Reverse</button>
            <button type="button" id="reset-btn" class="btn">Reset</button>
          </div>
          <label class="control-row">
            <span data-i18n="timeline-label">Timeline</span>
            <input
              type="range"
              id="timeline"
              min="0"
              max="30"
              step="0.1"
              value="0"
              aria-valuemin="0"
              aria-valuemax="30"
            />
          </label>
          <label class="control-row">
            <span data-i18n="intensity-label">Eruption intensity</span>
            <input type="range" id="intensity" min="0" max="1" step="0.01" value="0.65" />
          </label>
          <div class="toggles">
            <label class="toggle">
              <input type="checkbox" id="cutaway" checked />
              <span data-i18n="cutaway-label">Cutaway interior</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="labels" checked />
              <span data-i18n="labels-label">Anatomy labels</span>
            </label>
          </div>
        </section>

        <aside class="info-panel">
          <article class="stage-card" aria-live="polite">
            <h2 data-i18n="stage-heading">Eruption stage</h2>
            <h3 id="stage-title" class="stage-title"></h3>
            <p id="stage-time" class="stage-time"></p>
            <p id="stage-desc" class="stage-desc"></p>
          </article>

          <section class="side-block">
            <h2 data-i18n="legend-heading">Legend</h2>
            <ul id="legend-list" class="legend-list"></ul>
          </section>

          <section class="side-block">
            <h2 data-i18n="help-heading">Controls &amp; accessibility</h2>
            <p id="help-intro" class="help-intro"></p>
            <ul id="keyboard-list" class="keyboard-list"></ul>
          </section>
        </aside>
      </main>

      <footer class="site-footer">
        <div id="footer-meta" class="footer-meta"></div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
